<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DSW project by Vasilije Stanković">
    <meta name="keywords" content="java, javafx, oop">
    <title>DSW - Vasilije Stanković</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#0f1419; --secondary:#00ff88; --text:#f5f5f5; --container:min(90%, 1200px); --light-bg:#f0f0f0; --light-text:#333; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background:var(--primary); color:var(--text); line-height:1.6; }
        body.light-mode { background:var(--light-bg); color:var(--light-text); }
        .navbar { position:fixed; top:0; width:100%; background:rgba(15,20,25,.95); padding:1rem 0; z-index:1000; }
        .nav-content { max-width:var(--container); margin:0 auto; display:flex; justify-content:space-between; align-items:center; padding:0 1rem; }
        .nav-logo { color:var(--secondary); font-weight:700; font-size:1.5rem; }
        .nav-menu { display:flex; gap:1.5rem; list-style:none; align-items:center; }
        .nav-menu a { color:inherit; text-decoration:none; }
        .theme-toggle,.language-toggle { background:none; border:none; color:var(--secondary); cursor:pointer; font-size:1.1rem; }
        .container { max-width:var(--container); margin:0 auto; padding:7rem 1rem 3rem; }
        h1 { color:var(--secondary); text-align:center; margin-bottom:1rem; }
        .project-tech { display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center; margin-bottom:1rem; }
        .tech-tag { background:var(--secondary); color:var(--primary); padding:.35rem .9rem; border-radius:999px; font-size:.9rem; }
        .project-description { max-width:900px; margin:0 auto; text-align:center; }
        .project-links { display:flex; gap:1rem; justify-content:center; margin-top:1.5rem; }
        .project-link { background:var(--secondary); color:var(--primary); text-decoration:none; font-weight:600; padding:.6rem 1rem; border-radius:10px; }
        @media(max-width:900px){ .nav-menu { display:none; } }
    </style>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <div class="nav-content">
            <div class="nav-logo">VS Code</div>
            <ul class="nav-menu" role="menubar">
                <li><a href="index.html#home" data-lang-key="home">Početna</a></li>
                <li><a href="index.html#about" data-lang-key="about">O meni</a></li>
                <li><a href="index.html#skills" data-lang-key="skills">Veštine</a></li>
                <li><a href="index.html#projects" data-lang-key="projects">Projekti</a></li>
                <li><a href="courses.html" data-lang-key="courses">Kursevi</a></li>
                <li><a href="index.html#contact" data-lang-key="contact">Kontakt</a></li>
                <li><button class="theme-toggle fas fa-sun" onclick="toggleTheme()" aria-label="Toggle theme"></button></li>
                <li><button class="language-toggle" onclick="toggleLanguage()" aria-label="Toggle language">SR</button></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section>
            <h1 data-lang-key="project_title">DSW</h1>
            <div class="project-tech">
                <span class="tech-tag">Java</span>
                <span class="tech-tag">JavaFX</span>
                <span class="tech-tag">OOP</span>
            </div>
            <p class="project-description" data-lang-key="project_description">Aplikacija za planiranje prostora sa interaktivnim GUI-jem i MVC arhitekturom.</p>
            <div class="project-links">
                <a href="https://github.com/Vaske10024/dsw-projekat-main" class="project-link" target="_blank">GitHub</a>
                <a href="index.html#projects" class="project-link" data-lang-key="back_to_projects">Back to Projects</a>
            </div>
        </section>
    </main>

    <script>
        const translations = {
            en: {
                home: "Home", about: "About", skills: "Skills", projects: "Projects", courses: "Courses", contact: "Contact",
                project_title: "DSW", project_description: "A room planning app with an interactive GUI and MVC architecture.", back_to_projects: "Back to Projects"
            },
            sr: {
                home: "Početna", about: "O meni", skills: "Veštine", projects: "Projekti", courses: "Kursevi", contact: "Kontakt",
                project_title: "DSW", project_description: "Aplikacija za planiranje prostora sa interaktivnim GUI-jem i MVC arhitekturom.", back_to_projects: "Nazad na projekte"
            }
        };
        let currentLang = 'sr';
        function toggleLanguage() {
            currentLang = currentLang === 'sr' ? 'en' : 'sr';
            document.querySelector('.language-toggle').textContent = currentLang.toUpperCase();
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.getAttribute('data-lang-key');
                if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
            });
        }
        function toggleTheme() {
            const body = document.body; const toggle = document.querySelector('.theme-toggle');
            body.classList.toggle('light-mode');
            toggle.classList.toggle('fa-sun'); toggle.classList.toggle('fa-moon');
        }
    </script>
</body>
</html>
